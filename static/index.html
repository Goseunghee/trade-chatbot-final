<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trade Chatbot</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 30px;
      color: #1f4e79;
    }

    p.description {
      margin-top: 8px;
      color: #555;
      line-height: 1.6;
    }

    .input-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    input[type="text"] {
      flex: 1;
      min-width: 250px;
      padding: 14px 16px;
      font-size: 16px;
      border: 1px solid #cfd8e3;
      border-radius: 10px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #1f78ff;
      box-shadow: 0 0 0 3px rgba(31, 120, 255, 0.12);
    }

    button {
      padding: 14px 20px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #1f78ff;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #155ecc;
    }

    .sample-buttons {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .sample-buttons button {
      background: #eef4ff;
      color: #1f4e79;
      border: 1px solid #c6dafc;
      padding: 10px 14px;
      font-size: 14px;
    }

    .sample-buttons button:hover {
      background: #dfeeff;
    }

    .result {
      margin-top: 24px;
      padding: 18px;
      border-radius: 12px;
      background: #f8fbff;
      border: 1px solid #d9e8ff;
      display: none;
    }

    .result h2 {
      margin-top: 0;
      font-size: 20px;
      color: #1f4e79;
    }

    .answer-box {
      padding: 14px;
      background: white;
      border-left: 5px solid #1f78ff;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 16px;
      line-height: 1.6;
    }

    .data-box {
      margin-top: 16px;
      background: white;
      border-radius: 8px;
      padding: 14px;
      border: 1px solid #e3eaf5;
    }

    .data-row {
      margin: 8px 0;
      font-size: 15px;
    }

    .label {
      font-weight: bold;
      color: #333;
    }

    .loading {
      margin-top: 18px;
      color: #1f78ff;
      display: none;
      font-weight: bold;
    }

    .error {
      margin-top: 18px;
      color: #d93025;
      display: none;
      font-weight: bold;
    }

    .footer {
      margin-top: 20px;
      font-size: 13px;
      color: #666;
    }

    .badge {
      display: inline-block;
      margin-top: 8px;
      font-size: 12px;
      background: #eef6ff;
      color: #1f4e79;
      padding: 6px 10px;
      border-radius: 999px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 24px;
      }

      button {
        width: 100%;
      }

      .input-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>무역 데이터 챗봇</h1>
      <p class="description">
        국가별 최신 무역 데이터를 질문하면 수출, 수입, 무역수지를 자동으로 알려주는 챗봇입니다.
      </p>
      <div class="badge">FastAPI + CSV 기반 챗봇</div>

      <div class="input-group">
        <input
          type="text"
          id="questionInput"
          placeholder="예: 미국 최신 무역수지 알려줘"
        />
        <button onclick="askQuestion()">질문하기</button>
      </div>

      <div class="sample-buttons">
        <button onclick="setQuestion('미국 최신 무역수지 알려줘')">미국 최신 무역수지</button>
        <button onclick="setQuestion('중국 최신 수출 알려줘')">중국 최신 수출</button>
        <button onclick="setQuestion('일본 최신 수입 알려줘')">일본 최신 수입</button>
        <button onclick="setQuestion('미국 최신 무역수지 알려줘')">최신 데이터 예시</button>
      </div>

      <div class="loading" id="loading">응답을 불러오는 중입니다...</div>
      <div class="error" id="error"></div>

      <div class="result" id="result">
        <h2>챗봇 응답</h2>
        <div class="answer-box" id="answer"></div>

        <div class="data-box" id="dataBox">
          <div class="data-row"><span class="label">국가:</span> <span id="country"></span></div>
          <div class="data-row"><span class="label">날짜:</span> <span id="date"></span></div>
          <div class="data-row"><span class="label">연월:</span> <span id="yearMonth"></span></div>
          <div class="data-row"><span class="label">수출:</span> <span id="exportValue"></span></div>
          <div class="data-row"><span class="label">수입:</span> <span id="importValue"></span></div>
          <div class="data-row"><span class="label">무역수지:</span> <span id="tradeBalance"></span></div>
          <div class="data-row"><span class="label">Intent:</span> <span id="intent"></span></div>
        </div>
      </div>

      <div class="footer">
        API 문서가 필요하면 <b>/docs</b> 에서 Swagger UI로 확인할 수 있습니다.
      </div>
    </div>
  </div>

  <script>
    function setQuestion(text) {
      document.getElementById("questionInput").value = text;
    }

    function formatNumber(value) {
      return Number(value).toLocaleString();
    }

    async function askQuestion() {
      const input = document.getElementById("questionInput");
      const question = input.value.trim();

      const loading = document.getElementById("loading");
      const error = document.getElementById("error");
      const result = document.getElementById("result");

      error.style.display = "none";
      result.style.display = "none";

      if (!question) {
        error.innerText = "질문을 입력해주세요.";
        error.style.display = "block";
        return;
      }

      loading.style.display = "block";

      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ question })
        });

        if (!response.ok) {
          throw new Error("서버 요청에 실패했습니다.");
        }

        const data = await response.json();

        document.getElementById("answer").innerText = data.answer || "응답이 없습니다.";
        document.getElementById("country").innerText = data.data?.country ?? "-";
        document.getElementById("date").innerText = data.data?.date ?? "-";
        document.getElementById("yearMonth").innerText = data.data?.year_month ?? "-";
        document.getElementById("exportValue").innerText =
          data.data?.export_value !== undefined ? formatNumber(data.data.export_value) + " 천불" : "-";
        document.getElementById("importValue").innerText =
          data.data?.import_value !== undefined ? formatNumber(data.data.import_value) + " 천불" : "-";
        document.getElementById("tradeBalance").innerText =
          data.data?.trade_balance !== undefined ? formatNumber(data.data.trade_balance) + " 천불" : "-";
        document.getElementById("intent").innerText = data.intent ?? "-";

        result.style.display = "block";
      } catch (err) {
        error.innerText = "오류가 발생했습니다: " + err.message;
        error.style.display = "block";
      } finally {
        loading.style.display = "none";
      }
    }

    document.getElementById("questionInput").addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        askQuestion();
      }
    });
  </script>
</body>
</html>
